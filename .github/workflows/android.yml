name: Build FBrowser APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      # ---------- 拦截库源可达性检查（不中断构建） ----------
      - name: Verify adblock sources
        run: |
          SOURCES=(
            "https://raw.githubusercontent.com/privacy-protection-tools/anti-AD/master/anti-ad-domains.txt|anti-AD"
            "https://raw.githubusercontent.com/Cats-Team/AdRules/main/adblock.txt|Cats-Team"
            "https://github.com/217heidai/adblockfilters/releases/download/rule/adblockdnslite.txt|217heidai-Lite"
            "https://raw.githubusercontent.com/8680/GOODBYEADS/master/data/rules/ad-domain.txt|GOODBYEADS"
            "https://raw.githubusercontent.com/francis-zhao/quarklist/master/dist/quarklist.txt|QuarkList"
            "https://easylist-downloads.adblockplus.org/easylistchina.txt|EasyListChina"
          )
          for ENTRY in "${SOURCES[@]}"; do
            URL="${ENTRY%%|*}"
            NAME="${ENTRY##*|}"
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 20 -A "Mozilla/5.0" "$URL")
            if [ "$CODE" = "200" ]; then
              echo "✅ [$NAME] HTTP $CODE"
            else
              echo "⚠️  [$NAME] HTTP $CODE（运行时该源将被跳过）"
            fi
          done

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FBrowser-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: FBrowser-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      # ---------- 滚动版本号（满十进一） ----------
      - name: Compute rolling version
        id: version
        run: |
          N=$(( ${{ github.run_number }} - 1 ))
          MAJOR=$(( N / 10 ))
          MINOR=$(( N % 10 ))
          echo "TAG=v${MAJOR}.${MINOR}" >> $GITHUB_OUTPUT
          echo "Tag: v${MAJOR}.${MINOR}"

      - name: Create Git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.TAG }}
          git push origin ${{ steps.version.outputs.TAG }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          generate_release_notes: true