name: Build FBrowser APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 安装 JDK 17（AGP 8.x 要求）
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. 安装 Android SDK 组件
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK Platform 34
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      # 4. 配置 Gradle（自动缓存，使用指定版本）
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      # 5. 如果存在 wrapper 就赋予执行权限
      - name: Prepare wrapper
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew; fi

      # 6. 构建 Debug APK
      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      # 7. 构建 Release APK（未签名）
      - name: Build Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      # 8. 上传 Debug 产物
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FBrowser-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # 9. 上传 Release 产物
      - name: Upload Release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: FBrowser-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30

      # 10. 打 tag 时自动创建 Release 并附加 APK
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false